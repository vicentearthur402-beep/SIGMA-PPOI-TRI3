<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lançar notas</title>
  </head>
  <body>
    <header>
      <h1>SIGMA</h1>
      <h2>Lançar Notas</h2>
    </header>

    
    <main>
      <label for="materia">Matéria:</label>

      <select id="materia">
        <option value="artes">Artes</option>
        <option value="biologia">Biologia</option>
        <option value="educacao-fisica">Educação Física</option>
      </select>

      <table>
        <thead>
          <tr>
            <th rowspan="2">Aluno</th>

            <th colspan="3">1º Trimestre</th>

            <th colspan="3">2º Trimestre</th>

            <th colspan="3">3º Trimestre</th>

            <th rowspan="2">Média Final</th>
          </tr>

          <tr>
            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Recuperação</th>

            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Recuperação</th>

            <th>Nota 1</th>
            <th>Nota 2</th>
            <th>Recuperação</th>
          </tr>
        </thead>

        <tbody>
        </tbody>
      </table>

      <button id="salvarNotas">Salvar Notas</button>
      <p id="mensagemSalvamento"></p>
    </main>

    <script src="js/notas.js"></script>
  </body>
</html>
